<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-labelledby="t">
<title id="t">Czekinah Tolentino. One life, two render modes.</title>
<style>
  text { font-family: 'Baloo 2','Trebuchet MS','Segoe UI',sans-serif; }
  .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace; }
  .disp { font-family: Fraunces,Georgia,'Times New Roman',serif; }
  
  .tail { transform-origin: 0px 0px; animation: wag 1.6s ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: translate(-34px,26px) rotate(-8deg);} 50% { transform: translate(-34px,26px) rotate(14deg);} }
  .eyes { animation: blink 4.5s infinite; transform-origin: center; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1);} 95% { transform: scaleY(0.1);} }
  .ear2 { transform-origin: 24px -30px; animation: twitch 5s infinite; }
  @keyframes twitch { 0%,88%,100% { transform: rotate(0);} 91% { transform: rotate(-14deg);} 94% { transform: rotate(0);} }

  .typer { animation: typing 2.2s steps(23, end) 0.6s forwards; }
  @keyframes typing { from { width: 0; } to { width: 309px; } }
  .caret { animation: caretmove 2.2s steps(23, end) 0.6s forwards, caretblink 0.9s step-end infinite; }
  @keyframes caretmove { from { transform: translateX(0); } to { transform: translateX(309px); } }
  @keyframes caretblink { 50% { opacity: 0; } }
  .sub { opacity: 0; animation: rise 0.7s ease-out 2.9s forwards; }
  .sub2 { opacity: 0; animation: rise 0.7s ease-out 3.4s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .name { animation: rise 0.6s ease-out 0.1s both; }
  .fl { animation: floaty 4s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateY(0); } to { transform: translateY(270px); } }
  .fl2 { animation-delay: -1.3s; } .fl3 { animation-delay: -2.4s; }
</style>

<rect width="900" height="270" rx="22" fill="#FFFAF0"/>
<ellipse cx="760" cy="40" rx="150" ry="90" fill="#FFEDF6"/><ellipse cx="120" cy="250" rx="180" ry="70" fill="#F3ECFF"/><circle class="fl fl1" cx="640" cy="200" r="7" fill="#FFC61A"/><circle class="fl fl2" cx="820" cy="150" r="5" fill="#A98BFF"/><g class="fl fl3" transform="translate(690,60) scale(0.9)" fill="#FF69B4"><ellipse cx="0" cy="6" rx="7" ry="5.5"/><circle cx="-7" cy="-2" r="2.8"/><circle cx="0" cy="-5" r="2.8"/><circle cx="7" cy="-2" r="2.8"/></g><g class="fl fl1" transform="translate(850,230) scale(0.7)" fill="#A98BFF"><ellipse cx="0" cy="6" rx="7" ry="5.5"/><circle cx="-7" cy="-2" r="2.8"/><circle cx="0" cy="-5" r="2.8"/><circle cx="7" cy="-2" r="2.8"/></g>
<rect x="622.4000000000001" y="22" width="255.59999999999997" height="26" rx="13" fill="#FF69B4"/>
<text x="635.4000000000001" y="39" class="mono" font-size="12.5" fill="#FFFFFF" font-weight="700">render_mode: creative-writer</text>

<text x="40" y="52" class="mono" font-size="14" fill="#82627B">~/czekinah/purr-folio $ whoami</text>
<text x="40" y="104" class="disp name" font-size="46" font-weight="800" fill="#43223B">Czekinah Tolentino</text>

<g transform="translate(40,140)">
  <text x="0" y="0" class="mono" font-size="22" fill="#D81B7F" font-weight="700" clip-path="url(#typeclip)">SELECT * FROM czekinah;</text>
  <clipPath id="typeclip"><rect class="typer" x="0" y="-22" width="0" height="30"/></clipPath>
  <rect class="caret" x="0" y="-19" width="11" height="24" fill="#D81B7F"/>
</g>

<text x="40" y="190" class="sub" font-size="17" fill="#43223B">One life, two render modes:</text>
<text x="40" y="214" class="sub" font-size="17" fill="#43223B">creative writer <tspan fill="#82627B">&amp;</tspan> data engineer in training.</text>
<text x="40" y="246" class="mono sub2" font-size="12.5" fill="#82627B">// psst. I also speak SQL.  //  7+ yrs copy  ·  FTW Batch 12  ·  AWS re/Start  ·  45 DataCamp courses</text>


<g transform="translate(760,150) scale(1.25)">
  <g class="tail" transform="translate(-34,26)">
    <path d="M0 0 C -22 -6, -30 -30, -8 -40" fill="none" stroke="#43223B" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect x="-30" y="0" width="60" height="44" rx="14" fill="#43223B"/>
  <g class="head">
    <rect x="-26" y="-34" width="52" height="42" rx="12" fill="#43223B"/>
    <polygon class="ear" points="-24,-30 -24,-48 -8,-34" fill="#43223B"/>
    <polygon class="ear ear2" points="24,-30 24,-48 8,-34" fill="#43223B"/>
    <g class="eyes">
      <rect x="-15" y="-20" width="7" height="8" rx="2" fill="#FFFAF0"/>
      <rect x="8" y="-20" width="7" height="8" rx="2" fill="#FFFAF0"/>
    </g>
    <path d="M-3 -8 L3 -8 L0 -4 Z" fill="#FFC61A"/>
    <path d="M-9 -3 Q-4 1 0 -3 Q4 1 9 -3" fill="none" stroke="#FFFAF0" stroke-width="1.8" stroke-linecap="round"/>
    <g stroke="#82627B" stroke-width="1.4" stroke-linecap="round">
      <line x1="-34" y1="-8" x2="-22" y2="-7"/><line x1="-34" y1="-2" x2="-22" y2="-4"/>
      <line x1="34" y1="-8" x2="22" y2="-7"/><line x1="34" y1="-2" x2="22" y2="-4"/>
    </g>
  </g>
  <rect x="-24" y="38" width="14" height="10" rx="4" fill="#43223B"/>
  <rect x="10" y="38" width="14" height="10" rx="4" fill="#43223B"/>
</g>

</svg>
