<rect width="900" height="210" rx="14" fill="#0A1120"/><text x="40" y="34" class="mono" font-size="14" fill="#8FA3C7">$ psql -c "SELECT metric, value FROM writer_era WHERE brag = TRUE;"  <tspan fill="#5DFF87">-- the receipts</tspan></text><rect x="40" y="58" width="198" height="128" rx="10" fill="#101B33" stroke="#1D2C4D" stroke-width="1.5" /><text class="num n0 disp" x="58" y="110" font-size="38" font-weight="800" fill="#2BE3DF" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace">291%</text><text x="58" y="134" font-size="14" font-weight="600" fill="#E9F1FF">sales growth</text><text x="58" y="152" class="mono" font-size="11.5" fill="#8FA3C7">on my best campaign</text><rect x="58" y="166" width="162" height="7" rx="3.5" fill="#1D2C4D"/><rect class="bar b0" x="58" y="166" width="149" height="7" rx="3.5" fill="#2BE3DF"/><rect x="254" y="58" width="198" height="128" rx="10" fill="#101B33" stroke="#1D2C4D" stroke-width="1.5" /><text class="num n1 disp" x="272" y="110" font-size="38" font-weight="800" fill="#2BE3DF" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace">884%</text><text x="272" y="134" font-size="14" font-weight="600" fill="#E9F1FF">reach vs. KPI</text><text x="272" y="152" class="mono" font-size="11.5" fill="#8FA3C7">overdelivered</text><rect x="272" y="166" width="162" height="7" rx="3.5" fill="#1D2C4D"/><rect class="bar b1" x="272" y="166" width="162" height="7" rx="3.5" fill="#2BE3DF"/><rect x="468" y="58" width="198" height="128" rx="10" fill="#101B33" stroke="#1D2C4D" stroke-width="1.5" /><text class="num n2 disp" x="486" y="110" font-size="38" font-weight="800" fill="#2BE3DF" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace">#1</text><text x="486" y="134" font-size="14" font-weight="600" fill="#E9F1FF">Google rankings</text><text x="486" y="152" class="mono" font-size="11.5" fill="#8FA3C7">from search ad copy</text><rect x="486" y="166" width="162" height="7" rx="3.5" fill="#1D2C4D"/><rect class="bar b2" x="486" y="166" width="126" height="7" rx="3.5" fill="#2BE3DF"/><rect x="682" y="58" width="198" height="128" rx="10" fill="#101B33" stroke="#1D2C4D" stroke-width="1.5" /><text class="num n3 disp" x="700" y="110" font-size="38" font-weight="800" fill="#2BE3DF" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace">7+</text><text x="700" y="134" font-size="14" font-weight="600" fill="#E9F1FF">years</text><text x="700" y="152" class="mono" font-size="11.5" fill="#8FA3C7">agencies + B2B SaaS</text><rect x="700" y="166" width="162" height="7" rx="3.5" fill="#1D2C4D"/><rect class="bar b3" x="700" y="166" width="106" height="7" rx="3.5" fill="#2BE3DF"/><text x="40" y="198" class="mono" font-size="12" fill="#8FA3C7">(4 rows)  -- proof that I have been optimizing for metrics all along</text>
