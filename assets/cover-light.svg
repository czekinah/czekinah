<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-labelledby="t">
<title id="t">Czekinah's purr-folio cover. One life, two render modes.</title>
<style>
  text { font-family: 'Baloo 2','Trebuchet MS','Segoe UI',sans-serif; }
  .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace; }
  .disp { font-family: Fraunces,Georgia,'Times New Roman',serif; }
  
  .tail { transform-origin: 0px 0px; animation: wag 1.6s ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: translate(-34px,26px) rotate(-8deg);} 50% { transform: translate(-34px,26px) rotate(14deg);} }
  .eyes { animation: blink 4.5s infinite; transform-origin: center; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1);} 95% { transform: scaleY(0.1);} }
  .ear2 { transform-origin: 24px -30px; animation: twitch 5s infinite; }
  @keyframes twitch { 0%,88%,100% { transform: rotate(0);} 91% { transform: rotate(-14deg);} 94% { transform: rotate(0);} }

  .far { animation: scroll 70s linear infinite; }
  .near { animation: scroll 34s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  .fl { animation: floaty 5s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
  .sun { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .f1 { animation-delay: -1.7s; } .f2 { animation-delay: -3.3s; }
</style>

<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3ECFF"/><stop offset="1" stop-color="#FFFAF0"/></linearGradient></defs>
