<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-labelledby="t">
<title id="t">Czekinah's purr-folio cover. One life, two render modes.</title>
<style>
  text { font-family: 'IBM Plex Sans','Segoe UI',Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace; }
  .disp { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace; }
  
  .tail { transform-origin: 0px 0px; animation: wag 1.6s ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: translate(-34px,26px) rotate(-8deg);} 50% { transform: translate(-34px,26px) rotate(14deg);} }
  .eyes { animation: blink 4.5s infinite; transform-origin: center; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1);} 95% { transform: scaleY(0.1);} }
  .ear2 { transform-origin: 24px -30px; animation: twitch 5s infinite; }
  @keyframes twitch { 0%,88%,100% { transform: rotate(0);} 91% { transform: rotate(-14deg);} 94% { transform: rotate(0);} }

  .far { animation: scroll 60s linear infinite; }
  .near { animation: scroll 28s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  .star { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  .win { opacity: 0.75; animation: flick 4s step-end infinite; }
  @keyframes flick { 0%,100% { opacity: 0.75; } 45% { opacity: 0.2; } 55% { opacity: 0.75; } }
  .shoot { animation: shoot 9s ease-in infinite; }
  @keyframes shoot { 0%,88% { opacity: 0; transform: translate(700px,10px); } 90% { opacity: 1; } 100% { opacity: 0; transform: translate(520px,70px); } }
  .drift { animation: driftx 40s linear infinite; }
  @keyframes driftx { from { transform: translateX(900px); } to { transform: translateX(-900px); } }
  .s1 { animation-delay: -1s; } .s2 { animation-delay: -2s; }
  .w1 { animation-delay: -1.3s; } .w2 { animation-delay: -2.1s; } .w3 { animation-delay: -3.2s; }
  .d1 { animation-delay: -20s; }
</style>

<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1120"/><stop offset="1" stop-color="#0D1830"/></linearGradient></defs>
<rect width="900" height="220" rx="14" fill="url(#sky)"/>
