  <g class="layer far"><use href="#farL"/><use href="#farL" x="900"/></g>
  <g class="layer near"><use href="#nearL"/><use href="#nearL" x="900"/></g>
  <text class="drift d0" x="120" y="74" font-size="11" fill="#2BE3DF" opacity="0.35" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace">SELECT * FROM night WHERE cats = 'awake';</text>
